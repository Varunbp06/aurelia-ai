name: Aurelia AI CI

# The repository previously shipped only a commit-message policy workflow, so
# nothing ever compiled, linted or tested the application. This pipeline covers
# the backend test suite, the frontend quality gates and the Playwright smoke
# project that already existed but was never automated.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never point CI at real infrastructure. Everything below is a throw-away value.
  SECRET_KEY: ci-secret-key-not-for-production
  AURELIA_TEST_MODE: "1"
  NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
  NEXT_PUBLIC_WS_BASE_URL: ws://127.0.0.1:8000

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q --maxfail=25

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-nextjs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Production build
        run: npm run build

  e2e-smoke:
    name: Playwright smoke (E2E)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Start Redis (cache / session store)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo service redis-server start

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend-nextjs
        run: npm ci

      - name: Build frontend
        working-directory: frontend-nextjs
        run: npm run build

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://127.0.0.1:6333
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "backend up"; exit 0; fi
            sleep 2
          done
          echo "backend did not start"; tail -n 120 /tmp/backend.log; exit 1

      - name: Start frontend
        working-directory: frontend-nextjs
        run: |
          nohup npm run start -- --port 3000 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000 > /dev/null; then echo "frontend up"; exit 0; fi
            sleep 2
          done
          echo "frontend did not start"; tail -n 120 /tmp/frontend.log; exit 1

      - name: Run Playwright smoke project
        working-directory: tests/e2e
        env:
          BASE_URL: http://127.0.0.1:3000
          API_BASE_URL: http://127.0.0.1:8000
          CI: "true"
        run: npx playwright test --project=smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7

      - name: Backend log on failure
        if: failure()
        run: tail -n 200 /tmp/backend.log || true
